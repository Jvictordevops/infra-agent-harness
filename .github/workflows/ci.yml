# Lint, tests and leak scans on every push to main, every pull request and every release tag.
# macOS tests run only on release tags and on manual runs (workflow_dispatch), to save minutes while the repo is private.
# Actions are pinned by commit SHA (Dependabot keeps them current); the token is read-only.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: tests/lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: .github/scripts/install-gitleaks
      - name: Git identity for test repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Tests
        run: tests/run

  test-macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the system bash 3.2, as on a stock Mac
        # The runner image puts Homebrew bash 5 first in PATH, which would hide bash 3.2 failures.
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Install gitleaks
        run: .github/scripts/install-gitleaks
      - name: Git identity for test repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Tests
        run: |
          bash --version | head -n1
          tests/run

  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history is scanned
          persist-credentials: false
      - name: Install gitleaks
        run: .github/scripts/install-gitleaks
      - name: Secrets in the whole history (gitleaks default rules)
        run: gitleaks git --redact --no-banner --verbose .
      - name: Denylist in the tree and the history
        # The denylist (company names, internal domains, people) lives only in the IAH_DENYLIST secret.
        # Output never shows the matching text: these logs are public once the repo is.
        # Pull requests from forks and Dependabot get no secrets: generic patterns only.
        env:
          IAH_DENYLIST_TEXT: ${{ secrets.IAH_DENYLIST }}
        run: |
          if [ -z "$IAH_DENYLIST_TEXT" ]; then
            echo "::notice::No IAH_DENYLIST secret in this run (fork or Dependabot pull request): generic patterns only"
            IAH_DENYLIST=/nonexistent bin/denylist-scan --quiet
            exit
          fi
          umask 077
          printf '%s\n' "$IAH_DENYLIST_TEXT" > "$RUNNER_TEMP/denylist.txt"
          export IAH_DENYLIST="$RUNNER_TEMP/denylist.txt"
          rc=0
          bin/denylist-scan --quiet || rc=1
          bin/denylist-scan --history || rc=1
          exit "$rc"

  release:
    # Release tags only: the tag, plugin.json and CHANGELOG.md must agree (decision 3.5 of the work log)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag, plugin.json and CHANGELOG agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          pv="$(jq -r .version .claude-plugin/plugin.json)"
          [ "$v" = "$pv" ] || { echo "::error::tag $GITHUB_REF_NAME, but plugin.json has version $pv"; exit 1; }
          grep -qE "^## \[?${v//./\\.}\]?([[:space:]]|$)" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $v' entry"; exit 1; }
          echo "release $v: tag, plugin.json and CHANGELOG.md agree"
